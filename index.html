    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --accent-color: #ffffff;
            --energy: .12;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #020202;
            background: radial-gradient(circle at 50% 42%, #101010 0%, #040404 36%, #000 78%);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden !important;
            touch-action: manipulation;
            position: fixed;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: none !important;
            display: none !important;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 50;
            background-size: 100% 6px, 6px 100%;
            pointer-events: none;
            opacity: 0.3;
        }

        .scanline-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(255, 255, 255, 0.015) 50%, transparent 100%);
            z-index: 46;
            pointer-events: none;
            animation: scanlineAnim 12s linear infinite;
        }

        @keyframes scanlineAnim {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        #photo-webs-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 6;
            pointer-events: none;
            overflow: visible;
            perspective: 1500px;
            perspective-origin: 50% 50%;
            transform-style: preserve-3d;
        }

        .photo-web-3d {
            position: absolute;
            display: block;
            pointer-events: none;
            -webkit-user-drag: none;
            will-change: transform;

            -webkit-mask-image: radial-gradient(ellipse 50% 50% at center,
                #000 8%, rgba(0,0,0,.8) 28%, rgba(0,0,0,.38) 50%,
                rgba(0,0,0,.09) 76%, transparent 100%);
            mask-image: radial-gradient(ellipse 50% 50% at center,
                #000 8%, rgba(0,0,0,.8) 28%, rgba(0,0,0,.38) 50%,
                rgba(0,0,0,.09) 76%, transparent 100%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
            -webkit-mask-mode: alpha;
            mask-mode: alpha;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 95vw;
            height: 95vh;
            z-index: 4;
            pointer-events: none;
            contain: strict;
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: calc(16px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom)) 18px;
            gap: 12px;
            margin: 0 auto;
            max-width: 760px;
            perspective: 1200px;
            will-change: transform;
        }

        .logo-container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 420px;
            height: clamp(180px, 32vh, 300px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            margin: 0 auto;
            flex-shrink: 0;
            filter: saturate(.9) contrast(1.08);
        }

        @media (min-width: 769px) {
            .logo-container {
                max-width: 620px;
                height: clamp(260px, 38vh, 380px);
            }
        }

        #globe-3d-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 900px;
            perspective-origin: 50% 50%;
            transform-style: preserve-3d;
        }

        #globe-3d-container canvas {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: block;
            outline: none;
            filter: drop-shadow(0 0 18px rgba(214,226,242,.10)) drop-shadow(0 0 44px rgba(90,120,155,.055));
        }

        /* Curved PNG orbit: exact Hızlıresim artwork. The strips overlap slightly
           to remove hairline seams, while multiple rear layers create real visual depth. */
        .orbit-logo-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: visible;
            transform-style: preserve-3d;
            contain: layout style;
        }
        #orbit-logo-back { z-index: 1; }
        #orbit-logo-front { z-index: 3; }

        .orbit-logo-slice {
            position: absolute;
            left: 0;
            top: 0;
            transform-origin: 50% 50%;
            overflow: visible;
            will-change: transform, width, height;
            pointer-events: none;
            isolation: isolate;
        }

        .orbit-logo-face,
        .orbit-logo-depth,
        .orbit-logo-shine {
            position: absolute;
            inset: -0.75px;
            background-repeat: no-repeat;
            background-color: transparent;
            pointer-events: none;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .orbit-logo-depth {
            z-index: 0;
            opacity: .94;
            filter: brightness(.18) saturate(.72) contrast(1.32);
        }

        .orbit-logo-face {
            z-index: 10;
            transform: translateZ(0);
        }

        .orbit-logo-shine {
            z-index: 12;
            background: linear-gradient(102deg,
                rgba(255,255,255,0) 4%,
                rgba(185,211,238,.10) 28%,
                rgba(245,250,255,.70) 48%,
                rgba(255,255,255,.96) 54%,
                rgba(170,202,236,.16) 70%,
                rgba(255,255,255,0) 96%);
            mix-blend-mode: screen;
            opacity: 0;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
            will-change: opacity, filter;
        }

        html[data-quality="low"] .orbit-logo-depth.depth-extra { display: none; }

        .status-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 100%;
            flex-shrink: 0;
            padding: 0 4px;
        }

        .badge {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,.16);
            padding: 7px 12px;
            border-radius: 40px;
            font-size: 9.5px;
            font-weight: 900;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            white-space: nowrap;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 14px var(--accent-color);
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.1; transform: scale(0.3); }
        }

        .volume-control-box {
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,.16);
            padding: 6px 12px;
            border-radius: 40px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
            pointer-events: auto;
        }

        .volume-control-box.disabled {
            pointer-events: none;
        }

        .volume-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }

        .volume-btn:active { transform: scale(0.8); }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 45px;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-color);
        }

        @media (max-width: 480px) {
            .status-bar { gap: 6px; }
            .badge { padding: 5px 9px; font-size: 8px; letter-spacing: 1px; }
            .volume-control-box { padding: 5px 9px; }
            .volume-slider { width: 38px; }
        }

        @media (max-width: 600px) {
            .now-playing-card {
                gap: 10px;
                align-items: center;
            }

            .track-info {
                flex: 1 1 58%;
                min-width: 0;

            }

            .next-track {

            }

            .track-title,

                text-overflow: clip;
                overflow-wrap: anywhere;
                word-break: normal;

            .track-title {

            #next-track-name {

            }

            .track-label {

                letter-spacing: 1.25px;
            }
        }

        @media (max-width: 360px) {
            .now-playing-card { gap: 7px; }
            .track-title { font-size: clamp(8px, 3vw, 11px); }
            #next-track-name { font-size: clamp(6.5px, 2.35vw, 8px); }
        }

        .video-container {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 140px;
            max-height: 38vh;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.16);
            transition: border-color 0.3s, box-shadow 0.3s;
            margin: 2px 0;
        }

        #youtube-player {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none; pointer-events: auto;
        }

        .yt-shield-top-main { position: absolute; top: 0; left: 0; width: 100%; height: 82%; z-index: 15; background: transparent; }
        .yt-shield-bottom-left { position: absolute; bottom: 0; left: 0; width: 78%; height: 18%; z-index: 15; background: transparent; }
        .yt-shield-bottom-edge { position: absolute; bottom: 0; right: 0; width: 2%; height: 18%; z-index: 15; background: transparent; }

        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 45%, rgba(5, 5, 5, 0.50) 0%, rgba(0, 0, 0, 0.66) 58%, rgba(0, 0, 0, 0.80) 100%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }

        .start-btn {
            color: #000;
            font-family: 'Syne', sans-serif;
            font-weight: 900;
            font-size: 11px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .start-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(30deg);
            animation: btnShine 3s infinite;
        }

        @keyframes btnShine {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }


        .now-playing-card {
            width: 100%;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,.16);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
            max-width: 58%;
        }

        .track-label {
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .track-title {
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 900;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 14px rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
        }

        .next-track {
            font-size: 8.5px;
            color: #aaa;
            text-align: right;
            max-width: 40%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .wave-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
            margin-left: 4px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .wave-bar {
            width: 2.5px;
            background: var(--accent-color);
            border-radius: 1px;
            box-shadow: 0 0 8px var(--accent-color);
            animation: waveAnim 0.5s ease-in-out infinite alternate;
        }

        .wave-bar:nth-child(1) { height: 35%; animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { height: 90%; animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { height: 55%; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 100%; animation-delay: 0.4s; }

        @keyframes waveAnim {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }

        .badge, .volume-control-box, .now-playing-card, .video-container {
            isolation: isolate;
        }
        .badge::before, .volume-control-box::before, .now-playing-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(115deg, rgba(255,255,255,.09), transparent 28%, transparent 72%, rgba(255,255,255,.035));
            opacity: .55;
            z-index: -1;
        }
        .badge:hover, .volume-control-box:hover {
            transform: translateY(-1px);
            border-color: rgba(255,255,255,.58);
            box-shadow: 0 10px 34px rgba(0,0,0,.92), inset 0 0 16px rgba(255,255,255,.08);
        }
        .now-playing-card::after {
            content: "";
            position: absolute;
            left: 0; bottom: 0;
            width: var(--track-progress, 0%);
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,.25), #fff);
            box-shadow: 0 0 14px rgba(255,255,255,.65);
            transition: width .45s linear;
            pointer-events: none;
        }
        .track-time {
            margin-top: 2px;
            font-size: 7px;
            line-height: 1;
            letter-spacing: 1px;
            color: rgba(255,255,255,.42);
            font-variant-numeric: tabular-nums;
        }
        .video-container::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 14;
            pointer-events: none;
            border-radius: inherit;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.035), inset 0 -40px 70px rgba(0,0,0,.18);
        }
        .start-btn:focus-visible, .volume-btn:focus-visible, .volume-slider:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 4px;
        }
        @media (prefers-reduced-motion: reduce) {
            .scanline-overlay, .live-dot, .start-btn::after, .wave-bar { animation: none !important; }
            .photo-web-3d { will-change: auto; }
        }

        .video-container, .now-playing-card, .badge, .volume-control-box { background: linear-gradient(135deg, rgba(20,20,20,.82), rgba(4,4,4,.72)); box-shadow: 0 22px 70px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.06); }
        .video-container { border-radius:24px; transform:translateZ(0); }
        .now-playing-card { border-radius:22px; padding:16px 18px; }
        .status-bar { position:relative; z-index:20; }
        .badge,.volume-control-box { min-height:32px; }
        .start-btn { padding:16px 44px; min-width:170px; border-radius:999px; letter-spacing:3.2px; background:linear-gradient(135deg,#fff 0%,#dcdcdc 48%,#fff 100%); border:1px solid rgba(255,255,255,.9); box-shadow:0 10px 34px rgba(0,0,0,.58),0 0 24px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -2px 8px rgba(0,0,0,.14); }
        .start-btn::before { content:""; position:absolute; inset:4px; border-radius:inherit; border:1px solid rgba(0,0,0,.13); pointer-events:none; }
        .start-btn:hover { transform:translateY(-2px) scale(1.035); box-shadow:0 16px 42px rgba(0,0,0,.68),0 0 34px rgba(255,255,255,.24),inset 0 1px 0 #fff; }
        .start-btn:active { transform:translateY(0) scale(.985); }
        .ambient-glow { display:none !important; opacity:0 !important; background:none !important; filter:none !important; }
        body.playing .video-container { box-shadow:0 24px 80px rgba(0,0,0,.68),0 0 45px rgba(255,255,255,.055),inset 0 1px 0 rgba(255,255,255,.08); }
        body.playing .now-playing-card { box-shadow:0 18px 55px rgba(0,0,0,.7),0 0 26px rgba(255,255,255,.04); }
        html[data-quality="balanced"] .badge, html[data-quality="balanced"] .volume-control-box, html[data-quality="balanced"] .history-toggle, html[data-quality="balanced"] .now-playing-card { backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
        html[data-quality="balanced"] .ambient-glow { filter:blur(46px); }

        /* --- SP1DER 2.1 additions --- */
        #listener-count {
            display: inline-block;
            min-width: 1.2ch;
            text-align: center;
            font-variant-numeric: tabular-nums;
            transform-origin: center;
        }

        #listener-count.listener-pop {
            animation: listenerPop .34s cubic-bezier(.2,.8,.2,1);
        }

        @keyframes listenerPop {
            0% { transform: translateY(3px) scale(.82); opacity: .45; filter: blur(2px); }
            65% { transform: translateY(-1px) scale(1.10); opacity: 1; filter: blur(0); }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .track-title.track-swap,
        #next-track-name.track-swap {
            animation: trackSwap .40s cubic-bezier(.16,.84,.28,1);
        }

        @keyframes trackSwap {
            0% { opacity: 0; transform: translateY(6px); filter: blur(5px); }
            58% { opacity: 1; transform: translateY(-1px); filter: blur(0); }

        const STREAM_START_TIME = 1700000000;

        function seededShuffle(array, seed) {
            let shuffled = [...array];
            let m = shuffled.length, t, i;

            const pseudorandom = function() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            };

            while (m) {
                i = Math.floor(pseudorandom() * m--);
                t = shuffled[m];
                shuffled[m] = shuffled[i];
                shuffled[i] = t;
            }
            return shuffled;
        }

        const totalPlaylistDuration = baseSongList.reduce((acc, song) => acc + song.duration, 0);
        const playlistCache = new Map();

        function getPlaylistForCycle(cycleIndex) {
            if (!playlistCache.has(cycleIndex)) {
                playlistCache.set(cycleIndex, seededShuffle(baseSongList, cycleIndex + 42));
                // History only needs nearby cycles; prevent an unbounded cache.
                while (playlistCache.size > 4) {
                    const oldestKey = playlistCache.keys().next().value;
                    playlistCache.delete(oldestKey);
                }
            }
            return playlistCache.get(cycleIndex);
        }

        function getCurrentStreamState() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const totalElapsed = Math.max(0, nowInSeconds - STREAM_START_TIME);

            const cycleIndex = Math.floor(totalElapsed / totalPlaylistDuration);
            const elapsedTime = totalElapsed % totalPlaylistDuration;

            const currentPlaylist = getPlaylistForCycle(cycleIndex);

            let accumulatedTime = 0;
            for (let i = 0; i < currentPlaylist.length; i++) {
                if (elapsedTime < accumulatedTime + currentPlaylist[i].duration) {
                    return {
                        playlist: currentPlaylist,
                        cycleIndex,
                        songIndex: i,
                        seekTo: elapsedTime - accumulatedTime
                    };
                }
                accumulatedTime += currentPlaylist[i].duration;
            }
            return { playlist: currentPlaylist, cycleIndex, songIndex: 0, seekTo: 0 };
        }

                seekTo = 0;
                if (songIndex >= playlist.length) {

                    playlist = getPlaylistForCycle(cycleIndex);
                    songIndex = 0;

                const grazing = 1 - Math.min(1, Math.abs(normal.dot(viewDir)));

                item.face.style.filter = `brightness(${brightness.toFixed(3)}) contrast(1.10) saturate(.96) drop-shadow(0 0 ${(2.2 + specular * 8).toFixed(1)}px rgba(214,231,250,${(0.09 + specular * 0.34).toFixed(3)}))`;

                // Reflection forms one broad continuous highlight band, not one highlight
                // per strip. The specular term is from the same point light used by Earth.
                const broadSpec = Math.min(1, specular * 1.18 + diffuse * 0.10 + grazing * 0.06);
                item.shine.style.opacity = (0.025 + broadSpec * 0.62).toFixed(3);
                item.shine.style.filter = `blur(${(0.15 + (1 - broadSpec) * 0.35).toFixed(2)}px)`;

                // Thick extrusion goes AWAY from the shared light's screen position. Multiple
                // tightly stacked copies merge into one solid 3D edge instead of visible lines.
                let dx = pc.x - lightScreen.x;
                let dy = pc.y - lightScreen.y;
                let len = Math.hypot(dx, dy);
                if (len < 1) {
                    dx = pc.x - centerScreen.x;
                    dy = pc.y - centerScreen.y;
                    len = Math.hypot(dx, dy) || 1;
                }
                const ux = dx / len;
                const uy = dy / len;
                const maxDepthPx = 7.2 + grazing * 2.8;
                item.depths.forEach((depthEl, depthIndex) => {
                    const t = (depthIndex + 1) / item.depths.length;
                    const depth = maxDepthPx * t;
                    depthEl.style.transform = `translate(${(ux * depth).toFixed(2)}px, ${(uy * depth).toFixed(2)}px)`;
                    depthEl.style.opacity = (0.94 - t * 0.18).toFixed(3);
                    depthEl.style.filter = `brightness(${(0.12 + diffuse * 0.18 + specular * 0.10).toFixed(3)}) saturate(.72) contrast(1.32)`;
                });
            }
        }

        let lastTime = performance.now();
        let lastRenderTime = lastTime;
        const targetFPS = renderQuality === 'low' ? 30 : renderQuality === 'balanced' ? 45 : 60;
        const targetFrameInterval = 1000 / targetFPS;

        let perfSampleStart = performance.now();
        let perfFrames = 0;

        function animateGlobe(currentTime) {
            requestAnimationFrame(animateGlobe);
            if (document.hidden) {
                lastTime = currentTime;
                lastRenderTime = currentTime;
                return;
            }

            const frameElapsed = currentTime - lastRenderTime;
            if (frameElapsed < targetFrameInterval - 0.5) return;
            lastRenderTime = currentTime - (frameElapsed % targetFrameInterval);

            perfFrames++;
            if (currentTime - perfSampleStart >= 2000) {
                const fps = perfFrames * 1000 / (currentTime - perfSampleStart);
                if (fps < targetFPS * 0.80 && adaptivePixelRatio > minimumPixelRatio) {
                    adaptivePixelRatio = Math.max(minimumPixelRatio, adaptivePixelRatio - 0.08);
                    renderer.setPixelRatio(adaptivePixelRatio);
                    resizeThreeJS();
                } else if (fps > targetFPS * 0.94 && adaptivePixelRatio < preferredPixelRatio) {
                    adaptivePixelRatio = Math.min(preferredPixelRatio, adaptivePixelRatio + 0.03);
                    renderer.setPixelRatio(adaptivePixelRatio);
                    resizeThreeJS();
                }
                perfFrames = 0;
                perfSampleStart = currentTime;
            }

            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            if (isNaN(deltaTime) || deltaTime > 0.1) return;

            const globeSpeed = isPlayingState ? 0.52 : 0.13;
            globeMesh.rotation.y += globeSpeed * deltaTime;

            updateOrbitLogo(deltaTime);

            animatePhotoWebs(deltaTime);
            renderer.render(scene, camera);
        }

        let lastWebMobileMode = window.innerWidth < 600;
        function handleResize() {
            resizeThreeJS();
            const mobileMode = window.innerWidth < 600;

            if (mobileMode !== lastWebMobileMode) {
                lastWebMobileMode = mobileMode;
                generatePhotoWebs();
            }
        }
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(handleResize, 120);
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (nowPlayingInterval) {
                    clearInterval(nowPlayingInterval);
                    nowPlayingInterval = null;
                }
                if (syncCheckInterval) {
                    clearInterval(syncCheckInterval);
                    syncCheckInterval = null;
                }
            } else {
                startNowPlayingTicker();
                if (userHasClicked) {
                    syncToLiveStream();
                    if (syncCheckInterval) clearInterval(syncCheckInterval);
                    syncCheckInterval = setInterval(syncToLiveStream, 2000);
                }
            }
        });

        resizeThreeJS();
        requestAnimationFrame(animateGlobe);

       const firebaseConfig = {
  apiKey: "AIzaSyA4WSlpMCyEZPi-jFo-IpJQb55I_JG9iAc",
  authDomain: "sp1der-e75ff.firebaseapp.com",
  databaseURL: "https://sp1der-e75ff-default-rtdb.firebaseio.com",
  projectId: "sp1der-e75ff",
  storageBucket: "sp1der-e75ff.firebasestorage.app",
  messagingSenderId: "1024402090973",
  appId: "1:1024402090973:web:05e86d82e09cd6e1bce434",
  measurementId: "G-R0W695S9N6"
};

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const listenersRef = db.ref('online_listeners');
        const listenerCountEl = document.getElementById('listener-count');

        // One deterministic RTDB child per browser tab/session. Reconnects overwrite the
        // same child instead of push/remove/push, eliminating duplicate or bouncing presence.
        let listenerSessionId = sessionStorage.getItem('sp1der-listener-session');
        if (!listenerSessionId) {
            listenerSessionId = (window.crypto && typeof window.crypto.randomUUID === 'function')
                ? window.crypto.randomUUID()
                : 's-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 11);
            sessionStorage.setItem('sp1der-listener-session', listenerSessionId);
        }

        const myPresenceRef = listenersRef.child(listenerSessionId);
        let firebaseConnected = false;
        let presenceWanted = false;
        let presenceRegistered = false;
        let presenceWriteInFlight = false;
        let presenceGeneration = 0;
        let renderedListenerCount = Math.max(0, Number(listenerCountEl?.textContent || 0));
        let latestServerListenerCount = renderedListenerCount;
        let listenerDropTimer = null;

        function renderListenerCount(value) {
            if (!listenerCountEl) return;
            const stable = Math.max(0, Math.floor(Number(value) || 0));
            if (stable === renderedListenerCount && listenerCountEl.textContent === String(stable)) return;
            renderedListenerCount = stable;
            listenerCountEl.textContent = String(stable);
        }

        async function registerListeningPresence() {
            if (!presenceWanted || !firebaseConnected || presenceRegistered || presenceWriteInFlight) return;
            presenceWriteInFlight = true;
            const generation = ++presenceGeneration;
            try {
                // Arm server-side cleanup BEFORE announcing this listener.
                await myPresenceRef.onDisconnect().remove();
                if (!presenceWanted || !firebaseConnected || generation !== presenceGeneration) return;
                await myPresenceRef.set({ joinedAt: firebase.database.ServerValue.TIMESTAMP });
                if (presenceWanted && firebaseConnected && generation === presenceGeneration) {
                    presenceRegistered = true;
                }
            } catch (err) {
                console.warn('Listener presence write failed:', err);
            } finally {
                presenceWriteInFlight = false;
                if (presenceWanted && firebaseConnected && !presenceRegistered) {
                    setTimeout(registerListeningPresence, 350);
                }
            }
        }

        function removeListeningPresence() {
            presenceWanted = false;
            presenceRegistered = false;
            presenceGeneration++;
            clearTimeout(listenerDropTimer);
            myPresenceRef.remove().catch(() => {});
        }

        function setListeningPresence(active) {
            const shouldListen = Boolean(active && userHasClicked);
            if (!shouldListen) {
                removeListeningPresence();
                return;
            }

            presenceWanted = true;
            // As soon as JOIN LIVE is accepted, this tab is conceptually one listener.
            // Never flash back to 0 while Firebase is completing/reconnecting the write.
            renderListenerCount(Math.max(1, renderedListenerCount, latestServerListenerCount));
            registerListeningPresence();
        }

        db.ref('.info/connected').on('value', (snap) => {
            firebaseConnected = snap.val() === true;
            if (firebaseConnected) {
                presenceRegistered = false;
                if (presenceWanted) registerListeningPresence();
            } else {
                presenceRegistered = false;
            }
        });

        listenersRef.on('value', (snap) => {
            latestServerListenerCount = snap.numChildren();
            clearTimeout(listenerDropTimer);

            // Critical anti-flicker rule: after JOIN LIVE, this tab alone guarantees a
            // visible minimum of 1 even if RTDB briefly emits 0 during handshake/reconnect.
            const target = presenceWanted
                ? Math.max(1, latestServerListenerCount)
                : latestServerListenerCount;

            if (target >= renderedListenerCount) {
                renderListenerCount(target);
                return;
            }

            // Genuine departures are still shown, but only after the lower value remains
            // stable. Transient 1->0->1 / N->lower->N snapshots never reach the UI.
            listenerDropTimer = setTimeout(() => {
                const settledTarget = presenceWanted
                    ? Math.max(1, latestServerListenerCount)
                    : latestServerListenerCount;
                renderListenerCount(settledTarget);
            }, 1400);
        });

        window.addEventListener('pagehide', () => {
            removeListeningPresence();
        });
        window.addEventListener('pageshow', () => {
            if (userHasClicked) setListeningPresence(true);
        });

        // Pointer-follow effects are intentionally absent.
        
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js?v=43', { updateViaCache: 'none' })
                    .then((registration) => registration.update())
                    .catch((err) => { console.warn('Service worker registration failed:', err); });
            });
        }

        window.addEventListener('offline', () => showStreamStatus('CONNECTION LOST · RECONNECTING', 0));
        window.addEventListener('online', () => {
            showStreamStatus('BACK ONLINE', 1400);
            if (userHasClicked) syncToLiveStream();
        });

    </script>
